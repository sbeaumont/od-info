name: Publish container image

# Same trigger as the binary release build, so an r-tag produces binaries and an image.
on:
  push:
    tags: ['r*']
  workflow_dispatch:

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # arm64 is built under emulation, for Apple Silicon machines.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  bundle:
    name: Attach the unzip-and-run bundle
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Attaching an asset to the release is a write to the repository's contents.
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Create release archive
      run: |
        cp -r docker-dist odinfo-docker
        rm -f odinfo-docker/.gitignore
        chmod +x odinfo-docker/*.sh
        zip -r odinfo-docker.zip odinfo-docker

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: odinfo-docker.zip
        generate_release_notes: true