# Perks from the game reference data that have been looked at and are NOT relevant for this
# tool. Perks listed here are no longer flagged when refdata_update.py finds them coming or
# going in a new version of ref-data.
#
# Format is "perk_name: reason", where the reason is a note to your future self.
#
# The rule of thumb used below: intel shows unit counts, never the spells in effect.
#
# So a perk that changes POWER matters. Bloodrage leaves no trace in a scan, so the tool has
# to assume it is up and add the offense itself.
#
# A perk that changes COUNTS does not matter. Death and Decay turns peasants into units, and
# the next barracks spy simply shows more units. The tool reads the result and never has to
# know the spell was cast.
#
# The same goes for anything the tool doesn't model at all: production, construction, ops,
# invasion outcomes and the hero duels.
#
# Perks NOT listed here are treated as needing a look: either the tool acts on them, or you
# haven't decided yet.

