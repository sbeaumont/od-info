# The two containers that make up ODInfo. Started by start.sh / start.bat.
#
# Everything you can change sits in the .env file next to this one, which start writes for
# you on the first run: TZ, ODINFO_INSTANCE, ODINFO_PORT, ODINFO_BIND and ODINFO_ENGINE.
#
# TZ matters more than it looks: a container's clock is UTC, while ODInfo stores plain
# local timestamps and adds LOCAL_TIME_SHIFT to them, so a container in the wrong timezone
# records every observation hours off.

services:
  app:
    image: ghcr.io/sbeaumont/od-info:latest
    ports:
      # ODInfo listens on 5042 inside the container, the same port it uses everywhere
      # else, so there is nothing to translate. Published on every interface, because a
      # headless machine is no use if only that machine can reach it; the interface asks
      # for the login from users.json. ODINFO_BIND=127.0.0.1 keeps it to this machine.
      - "${ODINFO_BIND:-0.0.0.0}:${ODINFO_PORT:-5042}:5042"
    volumes:
      # Your configuration and database. Lives next to these scripts unless you point
      # ODINFO_INSTANCE somewhere else, at a full path like /srv/odinfo/instance.
      - ${ODINFO_INSTANCE:-./instance}:/app/instance:Z
    environment:
      TZ: ${TZ:?Put TZ=Area/City in the .env file, e.g. TZ=Europe/Amsterdam}
    restart: unless-stopped

  updater:
    image: ghcr.io/sbeaumont/od-info:latest
    volumes:
      - ${ODINFO_INSTANCE:-./instance}:/app/instance:Z
    environment:
      TZ: ${TZ:?Put TZ=Area/City in the .env file, e.g. TZ=Europe/Amsterdam}
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          wait=$$(( ((45 - $$(date +%-M) + 60) % 60) * 60 - $$(date +%-S) ))
          [ "$$wait" -le 0 ] && wait=$$(( wait + 3600 ))
          echo "Next update at $$(date -d "+$$wait seconds" +%H:%M), in $${wait}s"
          sleep "$$wait"
          python cron.py
        done